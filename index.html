<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R Facts — Storefront</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-enter {
      animation: cardFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-400 selection:text-black font-sans antialiased">

  <div>
    <!-- Sticky Navigation & Creator Header -->
    <header class="sticky top-0 z-40 backdrop-blur-md bg-[#0b0f19]/90 border-b border-slate-800/80 px-4 py-3">
      <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
        
        <!-- Creator Identity -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-400 to-amber-200 flex items-center justify-center font-extrabold text-slate-950 text-base shadow-sm ring-1 ring-amber-400/40">
            R
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="font-bold text-base text-white">R Facts</span>
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            </div>
            <p class="text-xs text-slate-400">@rfactts • Recommendations</p>
          </div>
        </div>

        <!-- Social Media Direct Links -->
        <div class="flex items-center gap-2">
          <a 
            href="https://www.youtube.com/@rfactts" 
            target="_blank" 
            rel="noopener"
            class="flex items-center gap-1.5 bg-[#ff0000] hover:bg-[#e60000] text-white text-xs font-bold px-3 py-1.5 rounded-lg transition"
          >
            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            <span>YouTube</span>
          </a>
          <a 
            href="https://instagram.com" 
            target="_blank" 
            rel="noopener"
            class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-700 transition"
          >
            Instagram
          </a>
        </div>

      </div>
    </header>

    <!-- Interactive Filter & Search Bar Area -->
    <section class="max-w-6xl mx-auto px-4 pt-6 pb-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        
        <!-- Live Search Field -->
        <div class="relative w-full md:max-w-xs">
          <span class="absolute left-3.5 top-2.5 text-slate-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </span>
          <input
            type="text"
            id="searchInput"
            placeholder="Search name or #ID..."
            class="w-full bg-slate-900 border border-slate-800 text-slate-100 rounded-xl pl-10 pr-8 py-2 text-xs placeholder:text-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition"
            oninput="handleSearch()"
          />
          <button 
            id="clearBtn"
            onclick="clearSearch()"
            class="hidden absolute right-2.5 top-2 text-slate-400 hover:text-white p-1 text-xs"
          >✕</button>
        </div>

        <!-- Dynamic Category Filter Container -->
        <div id="categoryContainer" class="flex flex-wrap items-center gap-1.5"></div>
      </div>
      
      <div class="flex items-center justify-between border-t border-slate-800/60 mt-4 pt-3">
        <span id="itemCount" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Loading...</span>
      </div>
    </section>

    <!-- Main Catalog View -->
    <main class="max-w-6xl mx-auto px-4 pb-16 w-full">
      <!-- Loading Skeletons -->
      <div id="loadingSkeletons" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 sm:gap-5">
        <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 animate-pulse h-72"></div>
        <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 animate-pulse h-72"></div>
        <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 animate-pulse h-72"></div>
        <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 animate-pulse h-72"></div>
      </div>

      <!-- Live Products Grid -->
      <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 sm:gap-5 hidden"></div>
    </main>
  </div>

  <!-- Amazon Associates Compliance -->
  <footer class="border-t border-slate-800/80 bg-[#070a11] py-6 text-center px-4">
    <p class="text-xs text-slate-500">
      As an Amazon Associate, I earn from qualifying purchases.
    </p>
  </footer>

  <script>
    let allProducts = [];
    let currentCategory = 'all';

    async function fetchProducts() {
      const skeletons = document.getElementById("loadingSkeletons");
      const grid = document.getElementById("productGrid");

      try {
        const res = await fetch(`./products.json?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error("Could not load products.json");

        allProducts = await res.json();
        allProducts.sort((a, b) => parseInt(b.id || 0) - parseInt(a.id || 0));

        skeletons.classList.add("hidden");
        grid.classList.remove("hidden");

        renderCategoryPills();
        applyFilters();
      } catch (err) {
        skeletons.innerHTML = `
          <div class="col-span-full text-center py-16 bg-slate-900 border border-slate-800 rounded-2xl">
            <p class="text-amber-400 font-semibold text-sm">Failed to load product catalog.</p>
            <p class="text-xs text-slate-500 mt-1">Make sure products.json is committed in your repository.</p>
          </div>
        `;
        console.error("Fetch error:", err);
      }
    }

    function renderCategoryPills() {
      const container = document.getElementById("categoryContainer");
      
      const categories = ['all', ...new Set(
        allProducts
          .map(p => (p.category || '').trim().toLowerCase())
          .filter(Boolean)
      )];

      container.innerHTML = categories.map(cat => {
        const isSelected = cat === currentCategory;
        const label = cat === 'all' 
          ? 'All' 
          : cat.charAt(0).toUpperCase() + cat.slice(1);

        const activeClasses = "border-amber-400/40 bg-amber-400/10 text-amber-300";
        const inactiveClasses = "border-slate-800 bg-slate-900 text-slate-400 hover:text-white hover:bg-slate-800";

        return `
          <button 
            onclick="selectCategory('${cat}')" 
            class="px-3 py-1.5 rounded-lg text-xs font-medium transition border ${isSelected ? activeClasses : inactiveClasses}"
          >
            ${label}
          </button>
        `;
      }).join("");
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategoryPills();
      applyFilters();
    }

    function renderProducts(items) {
      const grid = document.getElementById("productGrid");
      const countEl = document.getElementById("itemCount");
      
      countEl.innerText = `${items.length} ${items.length === 1 ? 'Item' : 'Items'}`;

      if (!items || items.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16 bg-slate-900/40 border border-slate-800/60 rounded-2xl">
            <p class="text-slate-300 font-medium text-sm">No matching items found</p>
            <p class="text-xs text-slate-500 mt-1">Try another keyword or category</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = items.map((p, index) => `
        <div 
          style="animation-delay: ${Math.min(index * 35, 300)}ms"
          class="card-enter group bg-slate-900 border border-slate-800 hover:border-amber-400/40 rounded-2xl p-3 flex flex-col justify-between shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-200"
        >
          <!-- Top Row: #ID and Tag -->
          <div class="flex items-center justify-between mb-2">
            <span class="px-2 py-0.5 rounded bg-amber-400 text-slate-950 font-black text-[10px] tracking-tight">
              #${p.id}
            </span>
            <span class="text-[10px] text-slate-500 group-hover:text-amber-400 transition-colors">
              Amazon ↗
            </span>
          </div>

          <!-- Product Image Container -->
          <a href="${p.link}" target="_blank" rel="noopener sponsored" class="block relative w-full pb-[100%] bg-white rounded-xl overflow-hidden mb-2.5">
            <img 
              src="${p.image}" 
              alt="${p.title}" 
              loading="lazy" 
              referrerpolicy="no-referrer"
              class="absolute inset-0 w-full h-full object-contain p-3 group-hover:scale-105 transition-transform duration-200 ease-out"
              onerror="this.src='https://via.placeholder.com/300?text=No+Image'"
            />
          </a>

          <!-- Details & Action Button -->
          <div class="flex flex-col gap-2">
            <h3 class="text-xs font-semibold text-slate-200 line-clamp-2 leading-tight group-hover:text-white" title="${p.title}">
              ${p.title}
            </h3>

            <a 
              href="${p.link}" 
              target="_blank" 
              rel="noopener sponsored"
              class="w-full bg-slate-800 hover:bg-amber-400 group-hover:bg-amber-400 text-slate-200 hover:text-slate-950 group-hover:text-slate-950 font-bold text-xs py-1.5 rounded-lg text-center transition-colors duration-150 flex items-center justify-center gap-1"
            >
              <span>View Deal</span>
              <span class="text-[10px]">→</span>
            </a>
          </div>
        </div>
      `).join("");
    }

    function handleSearch() {
      const clearBtn = document.getElementById("clearBtn");
      const query = document.getElementById("searchInput").value.trim();
      clearBtn.classList.toggle("hidden", query.length === 0);
      applyFilters();
    }

    function clearSearch() {
      const input = document.getElementById("searchInput");
      input.value = "";
      handleSearch();
      input.focus();
    }

    function applyFilters() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();

      const filtered = allProducts.filter(p => {
        const itemCat = (p.category || '').toLowerCase().trim();
        const matchesCategory = currentCategory === 'all' || itemCat === currentCategory;
        const matchesSearch = !query || 
          (p.title && p.title.toLowerCase().includes(query)) || 
          (p.id && p.id.toString().includes(query));

        return matchesCategory && matchesSearch;
      });

      renderProducts(filtered);
    }

    fetchProducts();
  </script>
</body>
</html>
