name: Sync Google Sheet to JSON

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Google Sheet CSV and convert to products.json
        run: |
          python -c "
          import urllib.request, csv, json

          url = 'https://docs.google.com/spreadsheets/d/1HFF7L8mdGi-gqaZ-5PXxXdhs2FFAForU1VWTYtYXFkw/gviz/tq?tqx=out:csv'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          response = urllib.request.urlopen(req)
          lines = [line.decode('utf-8') for line in response.readlines()]

          reader = csv.DictReader(lines)
          items = []
          for row in reader:
              # Normalize keys to lowercase and strip spaces
              clean_row = {k.strip().lower(): v.strip() for k, v in row.items() if k}
              
              if clean_row.get('id') and clean_row.get('title'):
                  items.append({
                      'id': int(clean_row['id']) if clean_row['id'].isdigit() else clean_row['id'],
                      'title': clean_row.get('title', ''),
                      'image': clean_row.get('image', ''),
                      'link': clean_row.get('link', ''),
                      'category': clean_row.get('category', '')
                  })

          with open('products.json', 'w', encoding='utf-8') as f:
              json.dump(items, f, indent=2, ensure_ascii=False)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync products and categories from Google Sheet" && git push)
